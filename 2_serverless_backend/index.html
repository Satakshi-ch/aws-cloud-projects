<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My AWS Cloud Portfolio</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 800px;
            margin: 40px auto;
            padding: 0 20px;
            color: #333;
            line-height: 1.6;
        }
        .container {
            border: 1px solid #e0e0e0;
            padding: 25px;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }
        h1 {
            color: #232f3e;
            border-bottom: 2px solid #ff9900;
            padding-bottom: 10px;
        }
        .btn {
            background-color: #ff9900;
            color: white;
            border: none;
            padding: 10px 20px;
            font-size: 16px;
            border-radius: 5px;
            cursor: pointer;
            font-weight: bold;
        }
        .btn:hover {
            background-color: #ec8b00;
        }
        #responseMsg {
            margin-top: 15px;
            font-size: 18px;
            font-weight: bold;
            color: #2e7d32;
        }
        .visitor-counter {
            margin-top: 20px;
            padding: 12px;
            background-color: #f4f4f4;
            border-radius: 5px;
            display: inline-block;
            font-weight: bold;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>My AWS Cloud Portfolio</h1>
        <p>Welcome to my cloud portfolio! Hosted on Amazon S3 and CloudFront, integrated with a serverless backend.</p>

        <!-- Phase 3: Live DynamoDB Visitor Counter -->
        <div class="visitor-counter">
            👀 Total Website Visitors: <span id="visitor-count">Loading...</span>
        </div>

        <h3>Serverless API Demo</h3>
        <p>Click the button below to test live data fetching from AWS Lambda via API Gateway:</p>
        
        <button class="btn" id="apiBtn">Fetch Backend Message</button>
        <div id="responseMsg"></div>
    </div>

    <script>
        // Tumhara exact API Gateway URL
        const API_URL = 'https://j2xdm4tr1i.execute-api.us-east-1.amazonaws.com/hello';

        // 1. Page Load hote hi DynamoDB Visitor Count Fetch & Increment karega
        window.addEventListener('DOMContentLoaded', () => {
            const visitorBox = document.getElementById('visitor-count');
            
            fetch(API_URL)
                .then(response => response.json())
                .then(data => {
                    if (data.views !== undefined) {
                        visitorBox.innerText = data.views;
                    } else {
                        visitorBox.innerText = "1"; // Fallback view count
                    }
                })
                .catch(error => {
                    console.error('Error fetching visitor count:', error);
                    visitorBox.innerText = 'Error loading count';
                });
        });

        // 2. Button Click Event Listener
        document.getElementById('apiBtn').addEventListener('click', () => {
            const msgBox = document.getElementById('responseMsg');
            msgBox.style.color = "#333";
            msgBox.innerText = "Connecting to AWS Lambda...";

            fetch(API_URL)
                .then(response => response.json())
                .then(data => {
                    msgBox.style.color = "#2e7d32";
                    msgBox.innerText = data.message || `API Call Success! DynamoDB Views: ${data.views}`;
                })
                .catch(error => {
                    console.error('Error fetching API:', error);
                    msgBox.style.color = "#d32f2f";
                    msgBox.innerText = 'Failed to load backend response.';
                });
        });
    </script>

</body>
</html>
