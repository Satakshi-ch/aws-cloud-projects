<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Cloud Journey | AWS Project 1</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        body {
            background-color: #0f172a;
            color: #f8fafc;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }
        .container {
            background-color: #1e293b;
            border-radius: 12px;
            padding: 40px;
            max-width: 600px;
            width: 100%;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.5);
            border: 1px solid #334155;
            text-align: center;
        }
        h1 {
            color: #38bdf8;
            font-size: 2rem;
            margin-bottom: 10px;
        }
        p {
            color: #94a3b8;
            font-size: 1.1rem;
            line-height: 1.6;
            margin-bottom: 25px;
        }
        .status-card {
            background-color: #0f172a;
            border-left: 4px solid #10b981;
            padding: 15px;
            border-radius: 6px;
            text-align: left;
            margin-bottom: 25px;
        }
        .status-card h3 {
            color: #10b981;
            font-size: 0.9rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 5px;
        }
        .status-card p {
            color: #e2e8f0;
            margin-bottom: 0;
            font-size: 0.95rem;
        }
        .badge-list {
            display: flex;
            justify-content: center;
            gap: 10px;
            flex-wrap: wrap;
        }
        .badge {
            background-color: #334155;
            color: #f1f5f9;
            padding: 6px 14px;
            border-radius: 20px;
            font-size: 0.85rem;
            font-weight: 600;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>🚀 AWS Cloud Journey</h1>
        <p>Phase 1 Complete: High-Availability Static Website Hosting</p>

        <div class="status-card">
            <h3>Deployment Status</h3>
            <p>Live on Amazon CloudFront (CDN) with Amazon S3 backend storage & OAC security.</p>
        </div>

        <div class="badge-list">
            <span class="badge">Amazon S3</span>
            <span class="badge">Amazon CloudFront</span>
            <span class="badge">AWS OAC</span>
            <span class="badge">HTTPS Secured</span>
        </div>
    </div>

</body>
</html>
